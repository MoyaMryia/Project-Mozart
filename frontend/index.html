<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" id="meta-theme-color" content="#FCFDFE">
  <title>Project Mozart · AI Voice Control Center</title>
  <script>
    // 首帧前确定主题，避免亮暗闪烁。无存储值时跟随系统偏好。
    (function () {
      var stored = null;
      try { stored = localStorage.getItem('mozart-theme'); } catch (e) { /* 隐私模式下忽略 */ }
      var theme = stored === 'dark' || stored === 'light' ? stored
        : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.dataset.theme = theme;
      var meta = document.getElementById('meta-theme-color');
      if (meta) meta.setAttribute('content', theme === 'dark' ? '#0C0E11' : '#FCFDFE');
    })();
  </script>
  <!-- 引入字体 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    /* 关键路径：主 CSS 加载完成前防止暗色主题闪白 */
    html[data-theme="dark"] { background: #0C0E11; }
  </style>
</head>
<body class="bg-app text-ink font-sans min-h-screen md:h-screen flex flex-col overflow-x-hidden md:overflow-hidden">
  <div id="app"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
