# 七七 + 索引检索：index_rate 0.5, nprobe 16, 模型内 +9 半音。
# 端口 18101/18181，避开全栈演示的 18000/18080。
input:
  contract:
    sample_rate: 16000
  meta:
    vad_enabled: false
output:
  sample_rate: 48000
network:
  audio:
    host: 127.0.0.1
    port: 18101
    frame_duration_ms: 20
  control:
    host: 127.0.0.1
    port: 18181
rvc:
  models_dir: /home/moyamryia/Mozart/rvc-backend/models
  hubert_path: /home/moyamryia/Mozart/rvc-golden/qiqi-zh-run/hubert_base_dynamic.onnx
  rmvpe_path: /home/moyamryia/Mozart/rvc-golden/qiqi-zh-run/rmvpe_dynamic.onnx
  realtime_hubert_path: /home/moyamryia/Mozart/rvc-golden/qiqi-zh-run/hubert-realtime.onnx
  realtime_rmvpe_path: /home/moyamryia/Mozart/rvc-golden/qiqi-zh-run/rmvpe-realtime.onnx
  f0_method: rmvpe
  pitch_shift: 9
  index_rate: 0.5
  index_nprobe: 16
  filter_radius: 3
  rms_mix_rate: 1.0
  protect: 0.33
  device: cuda
  half: false
  mock:
    generator: false
    hubert: false
    rmvpe: false
storage:
  temp_dir: /home/moyamryia/Mozart/rvc-golden/qiqi-zh-run/temp-index
  presets_path: /home/moyamryia/Mozart/rvc-golden/qiqi-zh-run/presets-index.json
  ffmpeg_path: ffmpeg
  file_rnnoise: false
  max_queue_depth: 5
# 预处理由 tools/run-realtime-voice.sh 管理。控制面只读设备与状态，
# 并按请求调用脚本的 pre-restart。
preprocessor:
  script: /home/moyamryia/Mozart/tools/run-realtime-voice.sh
  status_file: /tmp/mozart-realtime/pre-status.json
  devices_file: /tmp/mozart-realtime/pre-devices.json
  timeout_ms: 20000
