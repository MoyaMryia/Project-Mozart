# RVC Voice Changer Backend — Configuration
# 定位：接收预处理后的契约流音频，负责 RVC 变声推理
# 预处理（去噪/AEC/AGC/VAD 等）由 Project Mozart 负责，本后端不处理
#
# 只列出实际被读取的键（唯一读者：state/src/daemon.cpp）。
# 帧格式（16kHz INPUT / 48kHz OUTPUT / 20ms / f32 / 16B meta sideband）是
# 编译期契约，由 IO/include/mozart/frame_meta.h 固定，不提供运行时开关。

# ──────────────────────────────────────────────────────────
# 输入/输出采样率
# ──────────────────────────────────────────────────────────
input:
  contract:
    sample_rate: 16000        # 标准契约：16kHz（RVC 特征提取直接消费）
  meta:
    vad_enabled: true         # 输入侧带唯一可开关项：静音帧跳过推理

output:
  sample_rate: 48000          # RVC 生成器输出 48kHz，与声卡原生采样率一致

# ──────────────────────────────────────────────────────────
# 网络（UDP 音频契约流 + HTTP 控制）
# 音频端口接收预处理后的契约帧，也返回变声后的契约帧
# ──────────────────────────────────────────────────────────
network:
  audio:
    host: "0.0.0.0"
    port: 18000
    frame_duration_ms: 20     # 契约帧长 20ms
  control:
    host: "0.0.0.0"
    port: 18080

# ──────────────────────────────────────────────────────────
# RVC 推理配置
# ──────────────────────────────────────────────────────────
rvc:
  models_dir: "./models"

  # 特征提取器（16kHz 输入）
  hubert_path: "./assets/hubert/hubert_base.onnx"
  rmvpe_path: "./assets/rmvpe/rmvpe.onnx"
  # 固定形状 TensorRT 资产（240ms 低延迟 realtime profile 用）；
  # file/quality 路径继续走上面的可变长资产。留空 = 未配置。
  realtime_hubert_path: ""
  realtime_rmvpe_path: ""

  # 推理参数
  f0_method: "rmvpe"          # rmvpe / harvest / pm
  pitch_shift: 0              # 变调（半音）
  index_rate: 0.0             # 0 对齐 golden；.index 预加载已停用（见 model_loader.cpp）
  filter_radius: 3
  rms_mix_rate: 1.0           # 1.0 关闭 RMS 混合（golden）
  protect: 0.33

  # 性能
  device: "cuda"              # cuda / cpu
  half: false                 # fp16（Orin Nano 共享内存有限）
  # Components are independently mockable for diagnostics. Production FILE_RVC
  # requires all values to remain false.
  mock:
    generator: false
    hubert: false
    rmvpe: false

# ──────────────────────────────────────────────────────────
# 存储（文件转换走有界串行队列）
# ──────────────────────────────────────────────────────────
storage:
  temp_dir: "./storage/temp"
  presets_path: "./storage/presets.json"
  ffmpeg_path: "ffmpeg"
  max_queue_depth: 50
  max_cache_size_mb: 1000
