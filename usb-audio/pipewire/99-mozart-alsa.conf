# Mozart 预处理链路：物理 ALSA 节点低延迟周期。
# 放到 ~/.config/wireplumber/wireplumber.conf.d/ 后重启 WirePlumber。
monitor.alsa.rules = [
  {
    matches = [
      { node.name = "~alsa_output.*" }
      { node.name = "~alsa_input.*" }
    ]
    actions = {
      update-props = {
        api.alsa.period-size = 64
        api.alsa.periods     = 3
        api.alsa.headroom    = 0
      }
    }
  }
]
