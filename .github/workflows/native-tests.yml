name: Native regression tests

on:
  push:
    branches: [main, 'fix/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  cpu-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python test dependencies
        run: python3 -m pip install numpy==2.1.3
      - name: Install native test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build g++ libasound2-dev libspdlog-dev \
            libyaml-cpp-dev nlohmann-json3-dev ffmpeg pkg-config \
            libavfilter-dev libavutil-dev
      - name: Configure without GPU or model assets
        run: >-
          cmake -S rvc-backend -B build/host -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DUSE_ONNX=OFF -DUSE_TENSORRT=OFF -DBUILD_TESTS=ON
          -DMOZART_BUILD_TESTS=ON
      - name: Build native targets
        run: cmake --build build/host -j2
      - name: Run native regression tests
        run: ctest --test-dir build/host --output-on-failure
      - name: Repeat queue lifecycle tests
        run: ctest --test-dir build/host -R '^state_' --repeat until-fail:10 --output-on-failure
      - name: Run Python regression tests
        run: python3 -m unittest discover -s tools/tests -v
      - name: Build native tempo library
        run: |
          cmake -S preprocessor -B build-gpu/preprocessor -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug -DMOZART_USE_RNNOISE=OFF
          cmake --build build-gpu/preprocessor --target mozart_tempo_filter -j2
      - name: Run native tempo playback tests
        run: python3 -m unittest discover -s tools/tests -p test_tempo_player.py -v

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm --prefix frontend ci
      - run: npm --prefix frontend test
      - run: npm --prefix frontend run build
