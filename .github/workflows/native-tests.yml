name: Native regression tests

on:
  push:
    branches: [main, 'fix/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  cpu-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check limit sentences and broad except handlers
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -n "$BASE_SHA" ] && [ "$BASE_SHA" != 0000000000000000000000000000000000000000 ]; then
            bash tools/ci-local.sh lint --base-ref "$BASE_SHA"
          else
            bash tools/ci-local.sh lint
          fi
      - name: Install Python test dependencies
        run: python3 -m pip install numpy==2.1.3 scipy pyusb pypinyin jieba
      - name: Install native test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build g++ libasound2-dev libspdlog-dev \
            libyaml-cpp-dev nlohmann-json3-dev ffmpeg pkg-config \
            libavfilter-dev libavutil-dev
      # 检查命令只在 tools/ci-local.sh 中定义。本地 pre-commit hook 调用同一脚本。
      - name: Build and run native regression tests
        run: bash tools/ci-local.sh native
      - name: Run Python regression tests
        run: bash tools/ci-local.sh python
      - name: Build native tempo library and run playback tests
        run: bash tools/ci-local.sh tempo

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm --prefix frontend ci
      - run: bash tools/ci-local.sh frontend
